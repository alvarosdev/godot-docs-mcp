name: Build and Publish

on:
  schedule:
    # Every Sunday at 06:17 UTC — check for new Godot docs versions
    - cron: "17 6 * * 0"
  workflow_dispatch:
    inputs:
      godot_versions:
        description: "Space-separated Godot versions to build (e.g. '3.6 4.7'). Leave blank for auto-detect."
        required: false
        default: ""

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ═══════════════════════════════════════════════════════════════
  # 1. Detect whether docs changed and resolve versions
  # ═══════════════════════════════════════════════════════════════
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
      versions: ${{ steps.resolve.outputs.versions }}
      date_tag: ${{ steps.date.outputs.tag }}
    steps:
      - name: Checkout (for versions.lock)
        uses: actions/checkout@v4

      - name: Resolve versions to track
        id: resolve
        run: |
          MANUAL="${{ github.event.inputs.godot_versions }}"

          if [ -n "$MANUAL" ]; then
            VERSIONS_JSON=$(echo "$MANUAL" | jq -R 'split(" ") | map(select(length > 0))')
            echo "Manual versions: $VERSIONS_JSON"
          else
            BRANCHES=$(curl -sL \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/godotengine/godot-docs/branches?per_page=100" \
              | jq -r '.[].name' \
              | grep -E '^[0-9]+\.[0-9]+$')

            echo "Found version branches:"
            echo "$BRANCHES"

            VERSIONS_JSON=$(echo "$BRANCHES" | jq -R -s '
              [split("\n") | .[] | select(length > 0)]
              | group_by( split(".")[0] )
              | [ .[] | sort_by( split(".")[1] | tonumber ) | last ]
              | sort_by( split(".") | map(tonumber) )
            ')
          fi

          echo "Resolved versions: $VERSIONS_JSON"
          {
            echo "versions<<EOF"
            echo "$VERSIONS_JSON"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Compare SHAs against versions.lock
        id: compare
        run: |
          MANUAL="${{ github.event.inputs.godot_versions }}"
          VERSIONS=$(echo '${{ steps.resolve.outputs.versions }}' | jq -r '.[]')

          if [ -n "$MANUAL" ]; then
            echo "Manual dispatch — forcing build."
            CHANGED="true"
          else
            CHANGED="false"
            for V in $VERSIONS; do
              REMOTE_SHA=$(curl -sL \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
                "https://api.github.com/repos/godotengine/godot-docs/git/ref/heads/$V" \
                | jq -r '.object.sha // "unknown"')

              if [ -f versions.lock ]; then
                LOCKED_SHA=$(jq -r --arg v "$V" '.[$v] // "missing"' versions.lock)
              else
                LOCKED_SHA="missing"
              fi

              echo "Version $V: remote=$REMOTE_SHA  locked=$LOCKED_SHA"
              if [ "$REMOTE_SHA" != "$LOCKED_SHA" ] || [ "$LOCKED_SHA" = "missing" ]; then
                echo "  → change detected"
                CHANGED="true"
              fi
            done
          fi

          echo "changed=${CHANGED}" >> "$GITHUB_OUTPUT"

      - name: Generate date tag
        id: date
        run: |
          TAG=$(date +%Y.%m.%d)
          echo "Date tag: $TAG"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

  # ═══════════════════════════════════════════════════════════════
  # 2. Pre-build docs on amd64 (no QEMU)
  # ═══════════════════════════════════════════════════════════════
  prepare-docs:
    needs: detect-changes
    if: needs.detect-changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tree jq curl unzip

      - name: Generate docs
        run: |
          VERSIONS='${{ needs.detect-changes.outputs.versions }}'
          VERSION_LIST=$(echo "$VERSIONS" | jq -r 'join(",")')
          echo "Building docs for versions: $VERSION_LIST"
          bash scripts/generate-docs.sh "$VERSION_LIST"

      - name: Upload docs artifact
        uses: actions/upload-artifact@v5
        with:
          name: godot-docs
          path: docs/
          retention-days: 1

  # ═══════════════════════════════════════════════════════════════
  # 3. Build & push per-arch images (native, no QEMU)
  # ═══════════════════════════════════════════════════════════════
  build:
    needs: [detect-changes, prepare-docs]
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    permissions:
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download docs artifact
        uses: actions/download-artifact@v5
        with:
          name: godot-docs
          path: docs/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (${{ matrix.platform }})
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: ${{ matrix.platform }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.detect-changes.outputs.date_tag }}-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}

  # ═══════════════════════════════════════════════════════════════
  # 4. Merge per-arch images into a multi-arch manifest
  # ═══════════════════════════════════════════════════════════════
  merge-manifest:
    needs: [detect-changes, build]
    runs-on: ubuntu-latest
    permissions:
      packages: write

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch manifest
        run: |
          DATE_TAG="${{ needs.detect-changes.outputs.date_tag }}"
          IMG="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"

          for TAG in "$DATE_TAG" "latest"; do
            docker buildx imagetools create \
              --tag "${IMG}:${TAG}" \
              "${IMG}:${TAG}-amd64" \
              "${IMG}:${TAG}-arm64"
            echo "✓ Multi-arch manifest: ${IMG}:${TAG}"
          done

  # ═══════════════════════════════════════════════════════════════
  # 5. Update versions.lock
  # ═══════════════════════════════════════════════════════════════
  update-lockfile:
    needs: [detect-changes, merge-manifest]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update versions.lock
        run: |
          VERSIONS='${{ needs.detect-changes.outputs.versions }}'
          echo "{" > versions.lock
          FIRST=true
          for V in $(echo "$VERSIONS" | jq -r '.[]'); do
            SHA=$(curl -sL \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/godotengine/godot-docs/git/ref/heads/$V" \
              | jq -r '.object.sha')
            if [ "$FIRST" = "true" ]; then FIRST=false; else echo "," >> versions.lock; fi
            printf "  \"%s\": \"%s\"" "$V" "$SHA" >> versions.lock
          done
          echo "" >> versions.lock
          echo "}" >> versions.lock
          cat versions.lock

      - name: Commit and push versions.lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add versions.lock
          git diff --staged --quiet || git commit -m "chore: update versions.lock [skip ci]"
          git push
